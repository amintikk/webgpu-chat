# Files requested with ?v=<content hash> (icons, screenshots, theme.js, manifest) never change under that URL:
# cache them for a year. Everything else (pages, the service worker) is revalidated on each visit.
map $arg_v $public_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    # NPM already logs requests in front of this container; keep no second copy here.
    access_log off;
    # Relative redirects (e.g. /app -> /app/), so the https scheme from the proxy is kept.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json text/plain;
    gzip_min_length 1024;

    # The page may only talk to itself and to Hugging Face (model downloads: huggingface.co redirects the
    # weight files to its CDN, us.aws.cdn.hf.co, checked from several countries). Conversations cannot leave.
    # nginx drops inherited add_header lines in any location that sets its own, hence the snippet-like repetition.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://huggingface.co https://us.aws.cdn.hf.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Build output with content hashes in the file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
        # JavaScript modules (the PDF reader's worker): nginx's type map has no .mjs. Inherits the headers above.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            try_files $uri =404;
        }
    }

    # ONNX Runtime WebAssembly (replaced on each deploy, so revalidate).
    location /ort/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control $public_cache always;
        add_header Content-Security-Policy $csp always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
