<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Free, private AI chat in your browser · WebGPU Chat</title>
    <meta name="description" content="Open the chat and talk to an AI that runs on your device: free, no sign-up and no internet after the download. Your conversations never leave your browser." />
    <link rel="canonical" href="https://llm.aminox.dev/en/app/" />
    <link rel="alternate" hreflang="es" href="https://llm.aminox.dev/app/" />
    <link rel="alternate" hreflang="en" href="https://llm.aminox.dev/en/app/" />
    <link rel="alternate" hreflang="x-default" href="https://llm.aminox.dev/en/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WebGPU Chat" />
    <meta property="og:title" content="Free, private AI chat in your browser · WebGPU Chat" />
    <meta property="og:description" content="Open the chat and talk to an AI that runs on your device: free, no sign-up and no internet after the download. Your conversations never leave your browser." />
    <meta property="og:url" content="https://llm.aminox.dev/en/app/" />
    <meta property="og:image" content="https://llm.aminox.dev/og-en.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://llm.aminox.dev/og-en.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" aria-label="Conversations">
        <div class="sb-top">
          <a class="brand" href="/en/"><img src="/icon.svg" width="26" height="26" alt="" />WebGPU Chat</a>
          <button class="icon-btn" id="btn-close-drawer" type="button" aria-label="Close menu"><i data-icon="x" data-size="18"></i></button>
        </div>
        <button class="new-chat" id="btn-new" type="button"><i data-icon="plus" data-size="16"></i>New conversation<kbd>Ctrl ⇧ O</kbd></button>
        <label class="search"><i data-icon="search" data-size="15"></i><input id="search" type="search" placeholder="Search conversations" aria-label="Search conversations" /></label>
        <nav class="conv-list" id="conv-list" aria-label="History"></nav>
        <div class="sb-bottom">
          <button class="sb-link" id="btn-models" type="button"><i data-icon="hardDrive" data-size="16"></i>Models</button>
          <a class="lang-switch" href="/app/" hreflang="es" lang="es" title="Leer en español">ES</a>
          <button class="icon-btn" id="btn-theme" type="button" aria-label="Switch theme"></button>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>
      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="btn-menu" type="button" aria-label="Open menu"><i data-icon="menu" data-size="20"></i></button>
          <div class="model-picker" id="model-picker"></div>
          <span class="offline-pill" id="offline" hidden></span>
          <div class="top-actions">
            <button class="icon-btn" id="btn-settings" type="button" aria-label="Settings" title="Settings" aria-controls="settings" aria-expanded="false"><i data-icon="sliders" data-size="18"></i></button>
          </div>
        </header>
        <section class="thread is-empty" id="thread" aria-live="polite"><div class="thread-inner" id="thread-inner"></div></section>
        <footer class="composer-wrap">
          <div class="load-banner" id="load-banner" hidden></div>
          <form class="composer" id="composer">
            <textarea id="input" rows="1" aria-label="Message" placeholder="Write a message…"></textarea>
            <div class="composer-bar">
              <button class="chip" id="btn-reasoning" type="button" aria-pressed="false" title="The model thinks before answering"><i data-icon="brain" data-size="15"></i>Reason</button>
              <span class="ctx-mini" id="ctx-mini"></span>
              <button class="send" id="btn-send" type="submit" aria-label="Send"></button>
            </div>
          </form>
          <p class="disclaimer">It can make mistakes. Your chats stay on your device.</p>
        </footer>
      </main>
      <aside class="settings" id="settings" aria-label="Settings">
        <div class="settings-inner">
          <div class="settings-head">Settings<button class="icon-btn" id="btn-close-settings" type="button" aria-label="Close settings"><i data-icon="x" data-size="18"></i></button></div>
          <div class="settings-body" id="settings-body"></div>
        </div>
      </aside>
    </div>
    <dialog id="dlg-models" aria-label="Models"></dialog>
    <dialog id="dlg-card" aria-label="Model details"></dialog>
    <dialog id="dlg-confirm"></dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
